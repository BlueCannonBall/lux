<!DOCTYPE html>
<html lang="en">

<head>
    <title>Lux</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
    <meta name="background-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
    <style>
        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            padding: 0;
        }

        @media (display-mode: standalone) {
            #ios-blur-fix {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 11px;
                pointer-events: none;
                z-index: 2147483647;
                background-color: #13171F;
                -webkit-background-clip: text;
                background-clip: text;
            }
        }
    </style>
    <link rel="stylesheet" href="pico.classless.min.css">
</head>

<body>
    <!-- PWAs are BROKEN on iPadOS 27! The OS blurs the top of the app with the system status bar, ruining fullscreen remote desktop. This workaround busts the blur. -->
    <div id="ios-blur-fix" aria-hidden="true"></div>

    <script src="index.js" type="text/javascript"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("service-worker.js")
                    .then(() => console.log("Service Worker registered"))
                    .catch((error) => console.log("Service Worker registration failed:", error));
            });
        }
    </script>
</body>

</html>
